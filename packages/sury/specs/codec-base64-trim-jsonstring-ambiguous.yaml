# yaml-language-server: $schema=./spec.schema.json
ts:
  schema: S.base64.with(S.trim).with(S.to, S.jsonString)
  input: string
  output: string
  instantiations: 4593
jsonSchema:
  input: '{ type: "string", contentEncoding: "base64" }'
  output: '{ type: "string", contentMediaType: "application/json" }'
  draft-2020-12:
    output: '{ type: "string", contentMediaType: "application/json", contentSchema: { type: "string", contentEncoding: "base64" }, $schema: "https://json-schema.org/draft/2020-12/schema" }'
  openapi-3.0:
    input: '{ type: "string", format: "byte" }'
    output: '{ type: "string" }'
vs:
  zod:
    _skip: not-applicable
operations:
  parse:
    creationError: 'SuryError: Ambiguous string -> JSON string. Should the bytes be packed or unpacked? Choose with S.to and "pack" or "unpack"'
  decode: eq-to-parse
  # FIXME: parse rejects the pair but encode resolves it - reversing the `trim`
  # link puts a `.to` on the JSON string node, which reads as rule 3 naming a
  # payload. The schema is unusable either way, since decoding always throws.
  encode:
    expression: i=>{let v0;try{v0=JSON.parse(i)}catch(t){e[0](i)}typeof v0==="string"||e[5](v0);let v1;try{v1=e[1](v0)}catch(x){e[2](x)}e[3](v1)||e[4](v1);return v1}
    examples:
      unpacks-the-document:
        input: '"\"aGk=\""'
        output: '"aGk="'
