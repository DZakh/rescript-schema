# yaml-language-server: $schema=./spec.schema.json
ts:
  schema: S.union([S.number, S.string]).with(S.to, S.union([S.number.with(S.to, S.never), S.string]))
  input: string | number
  output: string
  instantiations: 6025
jsonSchema:
  input: '{ anyOf: [{ type: "number" }, { type: "string" }] }'
  output: '{ type: "string" }'
vs:
  zod:
    _skip: not-applicable
operations:
  parse:
    expression: i=>{for(;;){if(typeof i==="number"&&i===i){e[0](i);break}if(typeof i==="string")break;e[1](i)}return i}
    examples:
      rejected-number:
        input: "42"
        error: Expected never, received 42
      preserved-string:
        input: '"ok"'
        output: '"ok"'
        whenChecked: fails
  decode: eq-to-parse
  encode:
    creationError: "SuryError: Ambiguous never | string -> number | string. Should number be decoded or ignored? Choose with S.to for string -> number, or S.never -> number"
