# yaml-language-server: $schema=./spec.schema.json
ts:
  schema: S.string.with(S.length, 2)
  input: string
  output: string
  instantiations: 807
jsonSchema:
  input: '{ type: "string", minLength: 2, maxLength: 2 }'
  output: '{ type: "string", minLength: 2, maxLength: 2 }'
vs:
  zod: z.string().length(2)
operations:
