# yaml-language-server: $schema=./spec.schema.json
ts:
  schema: S.string.with(S.length, 1)
  input: string
  output: string
  instantiations: 807
jsonSchema:
  input: '{ type: "string", minLength: 1, maxLength: 1 }'
  output: '{ type: "string", minLength: 1, maxLength: 1 }'
vs:
  zod: z.string().length(1)
operations:
  parse:
    expression: i=>{typeof i==="string"||e[2](i);e[0](i)===1||e[1](i);return i}
    examples:
      at-the-length:
        input: '"a"'
        output: '"a"'
      one-astral-code-point-two-units:
        input: '"😀"'
        output: '"😀"'
      two-code-points:
        input: '"ab"'
        error: Expected string.length == 1, received "ab"
      empty:
        input: '""'
        error: Expected string.length == 1, received ""
      wrong-type:
        input: "1"
        error: Expected string.length == 1, received 1
  decode:
    expression: i=>{e[0](i)===1||e[1](i);return i}
