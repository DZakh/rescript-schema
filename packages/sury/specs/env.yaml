# yaml-language-server: $schema=./spec.schema.json
ts:
  schema: S.env
  input: string | undefined
  output: string
  instantiations: 254
jsonSchema:
  input: '{ type: "string" }'
  fromInputType: string
  output: '{ type: "string" }'
isEqual: strictEqual
vs:
  zod:
    _skip: not-applicable
operations:
  parse:
    expression: i=>{typeof i==="string"||e[0](i);return i}
    examples:
      valid:
        input: '"8080"'
        output: '"8080"'
      number:
        input: "1"
        error: Expected env, received 1
      object:
        input: "{}"
        error: Expected env, received {}
  # FIXME: an unset var is in the Input type, and the identity hands it back
  # as the string Output. The conversions check it (codec-env-to-port `unset`);
  # the bare schema does not, so `S.record(S.env)` stays the identity and
  # `process.env` is not walked before its fields are read.
  decode: identity
  encode: identity
